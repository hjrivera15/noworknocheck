<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Work No Check</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e4e7ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="No Work No Check">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e7ea; --panel:#f7f8f9; --ink:#17202c; --muted:#5b6674; --line:#c9cfd6;
  --red:#b8291b; --red-ink:#fff; --plate:#e3a81b; --ok:#2f7d4f; --field:#fff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a22; --panel:#1d2530; --ink:#e8ecf0; --muted:#98a3b0; --line:#323d4b;
    --red:#e0503e; --plate:#f0b83a; --ok:#57b27c; --field:#121820;
  }
}
:root[data-theme="dark"]{
  --bg:#141a22; --panel:#1d2530; --ink:#e8ecf0; --muted:#98a3b0; --line:#323d4b;
  --red:#e0503e; --plate:#f0b83a; --ok:#57b27c; --field:#121820;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);min-height:100%;}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}

/* Header */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 0 12px;border-bottom:4px solid var(--red)}
header.top h1{font:800 2.4rem/0.9 var(--display);margin:0;letter-spacing:.01em}
header.top .sub{color:var(--muted);font-size:.9rem}
.brand{display:flex;align-items:center;gap:14px}
.brand img{display:block;width:84px;height:84px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.brand .sub{font:700 1.15rem/1.1 var(--display);color:var(--ink);letter-spacing:.02em;text-transform:uppercase}
@media (max-width:420px){.brand img{width:72px;height:72px}.brand .sub{font-size:1rem}}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px 2px;margin:14px 0 18px}
nav.tabs button{flex:1 1 auto;min-width:64px;border:0;background:transparent;padding:9px 6px;font:700 1.08rem var(--display);color:var(--muted);border-bottom:3px solid var(--line)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* Library */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--field);border-radius:6px;margin-bottom:14px}
.wo{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:4px;padding:14px 14px 12px;margin-bottom:10px}
.wo h3{font:700 1.5rem/1.05 var(--display);margin:0 0 2px}
.wo .focus{color:var(--muted);font-size:.9rem}
.wo ul{list-style:none;margin:10px 0 12px;padding:0;font-size:.95rem}
.wo li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.wo li:last-child{border-bottom:0}
.wo li .rx{font-weight:600;white-space:nowrap}
.wo li.sec{font:700 .95rem var(--display);color:var(--red);border-bottom:0;padding-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:4px;padding:10px 16px;font:700 1.05rem var(--display);background:var(--ink);color:var(--bg)}
.btn.go{background:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 4px;font-size:.9rem}
.empty{border:2px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 1.4rem var(--display);margin-bottom:4px}
.note{font-size:.88rem;color:var(--muted);margin:6px 0 14px}

/* Session */
.sess-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sess-head h2{font:800 2rem/1 var(--display);margin:0}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.ex-h{padding:12px 14px 8px}
.ex-h h3{margin:0;font:700 1.35rem/1.1 var(--display)}
.ex-h .rx{font-weight:600}
.ex-h .cue{color:var(--muted);font-size:.9rem;margin-top:2px}
.ex-h .last{font-size:.9rem;margin-top:8px;padding:6px 10px;border-radius:4px;background:color-mix(in srgb,var(--plate) 18%,transparent);border-left:4px solid var(--plate);color:var(--ink)}
.ex-h .last .lt{font:700 .78rem var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.ex-h .last b{color:var(--ink);font:700 1.05rem var(--display)}
.ex-h .first{font-size:.85rem;margin-top:6px;color:var(--muted)}
.ibtn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);font:italic 700 .85rem Georgia,serif;margin-left:8px;vertical-align:middle;padding:0;flex:none}
.ibtn.has{border-color:var(--red);color:#fff;background:var(--red)}
.ex-h h3{display:flex;align-items:center;gap:2px}
.infotext{white-space:pre-wrap;line-height:1.5;margin:10px 0 4px;font-size:1rem}
.infotext a{color:var(--red)}
.sheet textarea{width:100%;min-height:160px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--field);font:inherit;margin-top:6px}
.bodyform{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.bodyform label{font-size:.8rem;color:var(--muted);font-weight:600}
.bodyform input{width:100%;padding:10px 8px;border:1px solid var(--line);border-radius:4px;background:var(--field);font:700 1.2rem var(--display);margin-top:3px}
@media (max-width:420px){.bodyform{grid-template-columns:1fr 1fr}.bodyform .full{grid-column:1/-1}}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox .ct{font:700 1.1rem var(--display)}
.exi{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.exi .s{font-size:.82rem;color:var(--muted)} .exi .s.y{color:var(--ok);font-weight:700}
.maxrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.maxrow .mn{font:700 1.15rem var(--display)}
.maxrow .mv{font:800 1.6rem/1 var(--display);grid-row:1/3;grid-column:2;text-align:right}
.maxrow .mv small{display:block;font:600 .72rem var(--body);color:var(--muted)}
.maxrow .ms{font-size:.82rem;color:var(--muted)}
.maxrow .ms .est{color:var(--ok);font-weight:700}
.pctw{display:inline-block;background:var(--ink);color:var(--bg);font:700 .95rem var(--display);padding:1px 8px;border-radius:3px;margin-left:4px}
.calc1rm{font:800 2rem var(--display);text-align:center;margin:8px 0 2px}
.mtab td.cell{cursor:pointer;font:700 1.1rem var(--display);text-align:center}
.mtab td.cell.empty{color:var(--muted);font:400 .9rem var(--body)}
.coachmsg{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:4px;padding:10px 12px;margin:0 0 10px;font-size:.98rem;line-height:1.45;white-space:pre-wrap}
.coachmsg .cl{display:block;font:700 .75rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.coachmsg a{color:var(--red)}
.coachmsg.phasemsg{border-left-color:var(--ink)}
.coachmsg.phasemsg .cl{color:var(--muted)}
.coachmsg.mine{border-left-color:var(--plate);background:color-mix(in srgb,var(--plate) 14%,var(--panel))}
.coachmsg.mine .cl{color:var(--ink)}
.cue2{margin-top:6px;padding:6px 10px;border-radius:4px;background:color-mix(in srgb,var(--plate) 18%,transparent);border-left:4px solid var(--plate);font-size:.92rem;white-space:pre-wrap}
.cue2 b{font:700 .75rem var(--body);letter-spacing:.05em;text-transform:uppercase;margin-right:4px}
.ntag{display:inline-block;background:var(--plate);color:#1a1a1a;font:700 .72rem var(--body);padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:middle}
.cnex{margin-top:10px}
.cnex label{display:block;font-weight:600;font-size:.88rem;margin-bottom:3px}
.cnex input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.sheet{max-height:88vh;overflow:auto}
.mode button{min-width:64px}
.bkcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.bkcard h3{font:800 1.4rem var(--display);margin:0 0 4px}
.bkwarn{background:color-mix(in srgb,var(--plate) 18%,transparent);border-left:4px solid var(--plate);padding:8px 12px;border-radius:4px;margin:0 0 12px;font-size:.92rem}
/* progress */
.lift{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
.lift>button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;border:0;background:transparent;padding:10px 12px;text-align:left}
.lift .ln{font:700 1.2rem/1.1 var(--display)}
.lift .ll{font-size:.85rem;color:var(--muted)}
.lift .ll b{color:var(--ink);font:700 1rem var(--display)}
.lift svg.sp{grid-row:1/3;grid-column:2;width:110px;height:36px}
.chg{font:700 .8rem var(--body);padding:1px 7px;border-radius:10px;margin-left:6px;white-space:nowrap}
.chg.up{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chg.down{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.chg.pr{background:var(--plate);color:#1a1a1a}
.lift .det{padding:0 12px 12px}
.lift .det svg{width:100%;height:auto;display:block;margin:4px 0 8px}
.lift .det .row2{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:4px 0;border-top:1px dashed var(--line)}
/* coach athletes */
.wkdots{display:flex;gap:4px;margin:2px 0 6px;align-items:center;flex-wrap:wrap}
.wkdots .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 .8rem var(--display);color:var(--muted)}
.wkdots .d.y{background:var(--ok);border-color:var(--ok);color:#fff}
.wkdots .d.miss{border-color:var(--red);color:var(--red)}
.wkdots .d.today{outline:2px solid var(--ink);outline-offset:1px}
.wkdots .cnt{font-weight:600;font-size:.88rem;margin-left:6px}
.an button.nmb{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.adet .dayrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.adet .dayrow .st{font-weight:700;white-space:nowrap}
.adet .dayrow .st.y{color:var(--ok)} .adet .dayrow .st.m{color:var(--red)} .adet .dayrow .st.u{color:var(--muted)}
.sec-label{font:700 1rem var(--display);color:var(--red);margin:18px 0 6px}
table.sets{width:100%;border-collapse:collapse}
table.sets th{font:600 .8rem var(--body);color:var(--muted);text-align:center;padding:4px}
table.sets td{padding:5px 4px;text-align:center;border-top:1px solid var(--line)}
table.sets td.n{font:700 1.3rem var(--display);width:40px;color:var(--muted)}
table.sets input{width:100%;max-width:110px;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:4px;background:var(--field);font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
table.sets input.rpe{max-width:72px}
table.sets th.rpe-h abbr{text-decoration:none}
table.sets tr.done td{background:color-mix(in srgb,var(--ok) 12%,transparent)}
table.sets tr.done input{border-color:var(--ok)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--field);font-size:1.2rem;line-height:1}
tr.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-foot{display:flex;justify-content:space-between;padding:6px 10px 10px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.dock .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rest{flex:1;display:flex;align-items:center;gap:10px}
.rest .t{font:800 2rem/1 var(--display);font-variant-numeric:tabular-nums;min-width:74px}
.rest .t.hot{color:var(--plate)}
.rest button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:4px;padding:6px 9px;font:700 .95rem var(--display)}
.rest .lbl{font-size:.8rem;opacity:.75}

/* Builder */
label.f{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
textarea.inp{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;line-height:1.5}
.mode{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:16px 0 6px}
.mode button{flex:1;border:0;background:var(--panel);padding:10px;font:700 1.05rem var(--display);color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mode.csub button{flex:1 1 25%;padding:10px 4px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:8px}
.item.section{border-left:5px solid var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.grid label{font-size:.75rem;color:var(--muted);display:block}
.grid input{width:100%;padding:8px 6px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.item .top{display:flex;gap:6px}
.item .top input{flex:1}
.icon{border:1px solid var(--line);background:var(--field);border-radius:4px;width:38px;min-width:38px;font-size:1rem}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.preview .bad{color:var(--red)}

/* Week */
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wk-head h2{font:800 1.9rem/1 var(--display);margin:0}
.wk-sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.day{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:4px;padding:12px;margin-bottom:8px}
.day.rest{border-left-color:var(--line);background:transparent}
.day.today{outline:2px solid var(--red);outline-offset:-1px}
.day.done{border-left-color:var(--ok)}
.day.done .dw{color:var(--muted)}
.dinfo{flex:1;min-width:0}
.dname{font:700 1rem var(--display);color:var(--muted)}
.dname .tag{background:var(--red);color:#fff;padding:1px 7px;border-radius:3px;font-size:.8rem;margin-left:6px}
.dname .ok{color:var(--ok);margin-left:6px}
.dw{font:700 1.35rem/1.1 var(--display)}
.dfocus{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .chk{flex:none}
.day.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.rest-dot{width:44px;flex:none;text-align:center;font-size:1.2rem;opacity:.6}
.day select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--field);margin-top:4px}

.phase{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:4px;padding:12px 14px;margin:0 0 14px}
.ph-wk{font:800 2.2rem/1 var(--display)}
.ph-name{font:700 1.2rem var(--display);color:var(--red);margin-top:2px}
.ph-note{font-size:.9rem;color:var(--muted);margin-top:4px}
.grid6 td,.grid6 th{text-align:center}
.grid6 td:first-child,.grid6 th:first-child{text-align:left}
.grid6 tr.cur td{background:color-mix(in srgb,var(--red) 10%,transparent);font-weight:600}
.grid6 .y{color:var(--ok);font-weight:800}
.grid6 .n{color:var(--muted)}
.wkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:inherit}
.wkdetail td{background:var(--bg);padding:10px 12px!important;text-align:left!important;white-space:normal}
.wkdetail .wd{margin-bottom:12px}
.wkdetail .wd h4{margin:0;font:700 1.15rem var(--display)}
.wkdetail .wd h4 .ok{color:var(--ok);font-size:.9rem;margin-left:6px}
.wkdetail .wd ul{list-style:none;margin:4px 0 0;padding:0;font-size:.9rem}
.wkdetail .wd li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dashed var(--line)}
.wkdetail .wd li.sec{font:700 .9rem var(--display);color:var(--red);border-bottom:0;padding-top:6px}
.wkdetail .wd li .rx{font-weight:600;text-align:right}
.wkdetail .phn{font:700 1rem var(--display);color:var(--red);margin-bottom:8px}
/* Program */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:4px;padding:10px 12px}
.pcard.cur{border-top-color:var(--red)}
.pcard .pw{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pcard .pn{font:800 1.5rem/1 var(--display);margin:2px 0 4px}
.pcard .pr2{font-weight:600;font-size:.92rem}
.pcard .pnote{font-size:.85rem;color:var(--muted);margin-top:4px}
.pcard .now{background:var(--red);color:#fff;font-size:.72rem;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.s7{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:4px;min-width:600px}
.s7 div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px;font-size:.8rem;min-height:58px}
.s7 div b{display:block;font:700 .95rem var(--display);color:var(--muted)}
.s7 div.off{background:transparent;color:var(--muted)}
.pday{margin:22px 0 6px}
.pday h3{font:800 1.5rem/1.05 var(--display);margin:0}
.pday .d{font:700 .95rem var(--display);color:var(--red)}
.pday .f{font-size:.88rem;color:var(--muted)}
table.ptab td{white-space:normal;font-size:.9rem}
table.ptab td:first-child{font-weight:600;min-width:150px}
table.ptab td.same{color:var(--muted);text-align:center}
table.ptab th.cur,table.ptab td.cur{background:color-mix(in srgb,var(--red) 10%,transparent)}
table.ptab tr.psec td{font:700 .95rem var(--display);color:var(--red);background:transparent;padding-top:12px}
.acct{text-align:right;font-size:.8rem;color:var(--muted);align-self:flex-start;padding-top:4px;max-width:40%}
.acct #who2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .link{padding:2px 0}
#auth{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px}
#auth[hidden]{display:none}
.auth-card{width:100%;max-width:380px;text-align:center}
.auth-card img{width:180px;height:180px;margin:8px auto 4px;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.auth-card .tag{font:700 1.2rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 18px}
.auth-card label{display:block;text-align:left;font-weight:600;font-size:.9rem;margin:10px 0 0}
.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--field);margin-top:4px;font-size:16px}
.auth-card .wide{width:100%;margin-top:14px;padding:13px;font-size:1.2rem}
.auth-card .or{color:var(--muted);margin:14px 0 0;font-size:.85rem}
.aerr{color:var(--red);font-weight:600;min-height:1.2em;margin:10px 0 0}
.setup{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:.92rem}
/* Coach */
.ath{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:8px}
.ath img{width:40px;height:40px;border-radius:50%;flex:none}
.ai{flex:1;min-width:0}
.an{font:700 1.25rem/1.1 var(--display)}
.an .you{font:600 .75rem var(--body);background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.as{font-size:.85rem;color:var(--muted);margin:2px 0 8px}
.arow{display:grid;grid-template-columns:1fr 150px auto;gap:6px;align-items:center}
.arow select,.arow input,.pv select{padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--field);width:100%}
@media (max-width:480px){.arow{grid-template-columns:1fr 1fr}.arow .btn{grid-column:1/-1}}
.pd{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.pd b{font:700 1rem var(--display)}
.pd select{padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.phg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phg label{font-size:.75rem;color:var(--muted)}
.phg input{width:100%;padding:8px 6px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
@media (max-width:480px){.phg{grid-template-columns:repeat(2,1fr)}}
.pxh{font:700 .8rem var(--body);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
.pxr{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:6px;background:var(--bg)}
.pxr select{width:100%;padding:8px 6px;margin-bottom:6px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chks label{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:.9rem;cursor:pointer}
.chks input{width:18px;height:18px;accent-color:var(--red)}
.pv{margin-bottom:14px}
/* History */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.stat b{display:block;font:800 1.9rem/1 var(--display)}
.stat span{font-size:.82rem;color:var(--muted)}
h2.h{font:800 1.6rem var(--display);margin:22px 0 8px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
.log > button{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;border:0;background:transparent;padding:12px 14px;text-align:left}
.log .nm{font:700 1.25rem var(--display)}
.log .meta{color:var(--muted);font-size:.85rem}
.log .body{padding:0 14px 12px;font-size:.92rem}
.log .body div{padding:2px 0}
.pr{overflow-x:auto}
.pr table{width:100%;border-collapse:collapse;font-size:.95rem;background:var(--panel);border:1px solid var(--line)}
.pr th,.pr td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.pr th{font:600 .8rem var(--body);color:var(--muted)}
.pr td.num{font:700 1.2rem var(--display);font-variant-numeric:tabular-nums}
.pr tr.fresh td.num{color:var(--plate)}

.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet{background:var(--panel);width:100%;max-width:720px;border-radius:10px 10px 0 0;padding:18px 16px 22px}
.sheet h2{font:800 1.8rem var(--display);margin:0 0 4px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}
.rpe button{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 0;font:700 1.15rem var(--display)}
.rpe button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;z-index:20;font-weight:600;max-width:90vw}
@media (max-width:420px){ header.top h1{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){ tr.done td{transition:background .2s} }

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

const S = {
  openWeek: null, cnotes: {}, maxes: {}, exinfo: {}, body: [], prof: {}, bdraft: {}, athData: {}, openAth: null, openLift: null, programs: [], assign: {}, roster: [], ppl: {}, adraft: {}, csub: 'athletes', pedit: null, previewProg: '', myProg: null, user: null, lib: [], logs: [], tab: 'week', sched: { days: [null,null,null,null,null,null,null] }, checks: {}, editWeek: false, session: null, edit: null, mode: 'paste', pasteText: '',

/* ---------- storage ---------- */
const store = {
  async saveWorkout(w) {

  },
  async saveChecks(key) {

    S.checks[key] = doc;
    if (S.db && S.uid) { try { await S.db.collection('users/' + S.uid + '/data').doc(key).set(doc); return; } catch (e) {} }
    local.set('wt-checks', S.checks);
  },
  async deleteLog(id) {
    if (S.db && S.uid) { try { await S.db.collection('users/' + S.uid + '/data').doc(id).delete(); } catch (e) {} }
    const before = S.logs.length;
    S.logs = S.logs.filter(l => l.id !== id);

/* ---------- smart paste parser ----------
   Reads a single workout or a whole program pasted from anywhere:
   "DAY 1 — LOWER BODY" splits workouts; "Back Squat — 4×6", "1. RDL 4x8 @ 135 - cue",
   "Band pull-apart ×15" under "2 rounds:"; section headers; Goal/notes; weekly schedule;
   "Weeks 1–2 / Foundation / Main lifts: 3–4×6–8 / RPE: 6.5–7.5" phases.            */
const EMO = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu;
const dash = s => s.replace(/[–—]/g, '-');
const titleCase = s => (s === s.toUpperCase() && /[A-Z]{2}/.test(s)) ? s.toLowerCase().replace(/(^|[\s\-/(+])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Db|Rdl|Bw|Amrap|Emom|Rpe|Pat)\b/g, x => x.toUpperCase()) : s;
const cleanLine = s => s.replace(/\*\*|__|`/g, '').replace(/^#+\s*/, '').replace(/^[-*•·▪◦►]\s*/, '').replace(/^\d+[.)]\s+/, '')
  .replace(/\b(\d+(?:\s*[-–—]\s*\d+)?)\s*sets?\s*(?:of|x|×|,)?\s*(?=\d|amrap|max)/gi, '$1x').replace(/(\d)\s*reps?\b/gi, '$1').trim();
function tableLine(l) {
  if (!/^\|.*\|$/.test(l)) return l;
  const c = l.slice(1, -1).split('|').map(x => x.trim());
  if (c.every(x => /^:?-{2,}:?$/.test(x) || !x)) return '';
  if (!c.slice(1).some(x => /\d/.test(x))) return /^(exercise|movement|lift|name)$/i.test(c[0]) ? '' : c[0];
  if (c.length >= 3 && /^\d+(\s*[-–]\s*\d+)?$/.test(c[1])) return `${c[0]} — ${c[1]}x${c[2].replace(/\s+/g, '')}${c.slice(3).filter(Boolean).length ? ' - ' + c.slice(3).filter(Boolean).join('; ') : ''}`;
  return `${c[0]} — ${c.slice(1).filter(Boolean).join(' - ')}`;
}
function splitRx(line) {
  for (const m of line.matchAll(/\s+[—–-]\s+|:\s+/g)) {
    const r = line.slice(m.index + m[0].length);
    if (/^[x×X]?\s*:?\d/.test(r)) return [line.slice(0, m.index).trim(), r.trim()];
  }
  const m = line.match(/\s(\d+\s*[x×X]\s*[\d:A-Za-z]|[x×]\s*\d)/);
  if (m) return [line.slice(0, m.index).trim(), line.slice(m.index + 1).trim()];
  return [line.trim(), ''];
}
function parseRx(rx, rounds) {
  let r = rx, notes = '', load = '';
  const nm = r.match(/\s+[—–-]\s+(.+)$/) || r.match(/\s*\(([^)]+)\)\s*$/);
  if (nm) { notes = nm[1].trim(); r = r.slice(0, nm.index).trim(); }
  r = r.replace(/\brest\s*\d+\s*(s|sec|secs|m|min)?\b/i, '').trim();
  const lm = r.match(/\s*@\s*(.+)$/); if (lm) { load = lm[1].trim(); r = r.slice(0, lm.index).trim(); }
  r = dash(r).replace(/\s*(seconds?|secs?)\b/i, 's').replace(/\s+(?=(yds?|yards?|m|s|min|reps?)\b)/i, '').replace(/\s*-\s*/g, '-').trim();
  let sets = rounds ? String(rounds) : '1', reps = r;
  const m = r.match(/^(\d+(?:-\d+)?)\s*[x×X]\s*(.+)$/);
  if (m) { sets = m[1]; reps = m[2]; } else { const m2 = r.match(/^[x×X]\s*(.+)$/); if (m2) reps = m2[1]; }
  return { sets, reps: reps.replace(/^reps?\s*/i, ''), load, rest: '', notes };
}
const looksEx = s => { const [n, rx] = splitRx(cleanLine(s)); return !!rx && !!n && n.length < 70 && !/^(main|accessor\w*|rpe|weeks?)\b/i.test(n); };
function smartParse(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => tableLine(l.replace(EMO, '').replace(/\s+/g, ' ').trim()));
  const out = { title: '', workouts: [], weeks: 0, phases: [], schedule: Array(7).fill(null) };
  let cur = null, mode = 'day', rounds = 0, ph = null;
  const wk = String(text || '').match(/(\d+)\s*-?\s*weeks?\b/i); if (wk) out.weeks = +wk[1];
  const ensure = () => cur || (cur = { name: '', focus: [], items: [] }, out.workouts.push(cur), cur);
  const nextLine = i => { for (let j = i + 1; j < lines.length; j++) if (lines[j]) return lines[j]; return ''; };
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i]) continue;
    const line = cleanLine(lines[i]);
    if (!line) continue;
    if (/^(day|workout|session|lift)\s*\d+\b/i.test(line) || /^(workout|day|session)\s+[A-Z]\b(?!\s*[x×]\s*\d)/i.test(line) && !looksEx(line)) {
      cur = { name: titleCase(line.replace(/[:]\s*$/, '')), focus: [], items: [] }; out.workouts.push(cur); mode = 'day'; rounds = 0; continue;
    }
    if (/^week(ly)?\s*schedule\b|^schedule:?$/i.test(line)) { mode = 'sched'; continue; }
    if (/progression|periodi[sz]ation/i.test(line) && !looksEx(line)) { mode = 'prog'; ph = null; continue; }
    const sm = line.match(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\s*[:\-–—]\s*(.+)$/i);
    if (sm) { const di = ['mon','tue','wed','thu','fri','sat','sun'].indexOf(sm[1].toLowerCase()); out.schedule[di] = /\b(rest|off|recovery day)\b/i.test(sm[2]) ? '' : sm[2].trim(); mode = 'sched'; continue; }
    if (mode === 'sched') continue;
    if (mode === 'prog' || /^weeks?\s*\d+\s*[-–—]\s*\d+\s*$/i.test(line)) {
      mode = 'prog';
      const w = line.match(/^weeks?\s*(\d+)(?:\s*(?:[-–—&]|to)\s*(\d+))?/i);
      if (w) { ph = { from: String(+w[1]), to: String(+(w[2] || w[1])), name: '', rpe: '', preset: '', msets: '', mreps: '', mpct: '', note: '' }; out.phases.push(ph); const rest = line.slice(w[0].length).replace(/^[\s:\-–—]+/, ''); if (rest && rest.split(' ').length <= 4) ph.name = titleCase(rest); continue; }
      if (!ph) continue;
      const ml = line.match(/^main( lifts?)?\s*:\s*(.+)$/i);
      if (ml) { const m = dash(ml[2]).replace(/\s*-\s*/g, '-').match(/^([\d-]+)\s*[x×X]\s*(\S+)/); if (m) { if (/^\d+$/.test(m[1])) ph.msets = m[1]; ph.mreps = m[2]; } const pm = dash(ml[2]).match(/@?\s*([\d.]+(?:\s*-\s*[\d.]+)?)\s*%/); if (pm) ph.mpct = pm[1].replace(/\s+/g, ''); continue; }
      const rp = line.match(/^rpe\s*:?\s*([\d.]+)(?:\s*[-–—]\s*([\d.]+))?/i);
      if (rp) { const a = +rp[1], b = +(rp[2] || rp[1]); ph.rpe = rp[2] ? `${rp[1]}–${rp[2]}` : rp[1]; ph.preset = String(Math.round(a + b) / 2); continue; }
      if (/^accessor/i.test(line)) continue;
      if (!ph.name && line.split(' ').length <= 4 && !/[.!?]$/.test(line)) { ph.name = titleCase(line); continue; }
      ph.note = (ph.note ? ph.note + ' ' : '') + line; continue;
    }
    const rm = line.match(/^(\d+)\s*(rounds?|circuits?)\b/i);
    if (rm && !looksEx(line)) {
      rounds = +rm[1]; const w = ensure(), last = w.items[w.items.length - 1];
      if (last && last.type === 'section' && !/round/i.test(last.label)) last.label += ` — ${rounds} rounds`;
      else w.items.push({ type: 'section', label: `${rounds} rounds` });
      continue;
    }
    if (looksEx(line)) {
      const [n, rx] = splitRx(line);
      ensure().items.push({ type: 'ex', name: n.replace(/\s*[:\-–—]\s*$/, '').trim(), ...parseRx(rx, rounds) });
      continue;
    }
    const prose = /^(goal|note|notes|important|tip|focus|coach(ing)?( note)?|why)\s*:/i.test(line) || /[.!?]$/.test(line) || line.split(' ').length > 7;
    const nx = nextLine(i);
    const header = !prose && (/:$/.test(line) || /^#/.test(line) || looksEx(nx) || /^\d+\s*(rounds?|circuits?)\b/i.test(cleanLine(nx)));
    if (!cur && !out.title && !header && !prose) { out.title = titleCase(line.replace(/:$/, '')); continue; }
    if (header) { rounds = 0; ensure().items.push({ type: 'section', label: titleCase(line.replace(/^#+\s*/, '').replace(/:$/, '').trim()) }); continue; }
    if (cur || out.workouts.length) ensure().focus.push(line.replace(/:$/, ''));
  }
  out.workouts = out.workouts.filter(w => w.items.some(x => x.type === 'ex')).map(w => {
    while (w.items.length && w.items[w.items.length - 1].type === 'section') w.items.pop();
    return { name: w.name, focus: w.focus.join(' · '), items: w.items };
  });
  return out;
}
const parseText = t => { const r = smartParse(t); return r.workouts.length === 1 ? r.workouts[0].items : r.workouts.flatMap(w => [{ type: 'section', label: w.name || 'Workout' }, ...w.items]); };
function matchSchedule(sched, wos) {
  const toks = s => new Set(String(s || '').toLowerCase().split(/[^a-z]+/).filter(t => t.length > 2 && !['day', 'the', 'and', 'with', 'for'].includes(t)));
  const days = sched.map(v => {
    if (!v) return null;
    const q = toks(v); let best = -1, bs = 0;
    wos.forEach((w, k) => {
      const a = toks(w.name), b = toks(w.items.filter(x => x.type === 'section').map(x => x.label).join(' ') + ' ' + w.focus.slice(0, 80));
      let sc = 0; q.forEach(t => { if (a.has(t)) sc += 2; else if (b.has(t)) sc += 1; });
      if (sc > bs) { bs = sc; best = k; }
    });
    return best >= 0 ? best : null;
  });
  if (days.some(d => d !== null)) return days;

const round5 = v => Math.round(v / 5) * 5;
const parsePct = load => { const m = String(load || '').replace(/[–—]/g, '-').match(/^\s*(\d+(?:\.\d+)?)\s*(?:-\s*(\d+(?:\.\d+)?))?\s*%\s*$/); return m ? [+m[1], +(m[2] || m[1])] : null; };
function pctLoad(load, name, maxes) {
  const pc = parsePct(load); if (!pc) return null;
  const mx = (maxes || {})[exKey(name)], orm = mx ? num(mx.oneRM) : 0;
  if (!orm) return { pct: pc, orm: 0 };
  const lo = round5(orm * pc[0] / 100), hi = round5(orm * pc[1] / 100);
  return { pct: pc, orm, lo, hi, mid: round5(orm * (pc[0] + pc[1]) / 200), text: lo === hi ? `${lo} lbs` : `${lo}–${hi} lbs` };
}
function estFromLogs(logs, name) {
  const s = liftSeries(logs).find(x => x.name.toLowerCase() === name.toLowerCase()); if (!s) return null;
  const recent = s.pts.filter(p => p.date > Date.now() - 120 * 864e5); if (!recent.length) return null;
  const best = recent.reduce((m, p) => p.e > m.e ? p : m); return { e: best.e, date: best.date, w: best.w, r: best.r };
}
function maxLifts(prog, maxes) {
  const names = new Set((prog && prog.main) || []);
  if (prog) allProgDays(prog).forEach(id => { const w = S.lib.find(x => x.id === id); if (w) w.items.forEach(it => { if (it.type === 'ex' && parsePct(it.load)) names.add(it.name); }); });
  Object.values(maxes || {}).forEach(m => names.add(m.name));

}
function maxListHtml(uid, prog, maxes, logs, canEdit) {

const lastBackup = () => +(local.get('nwnc-lastbackup', 0) || 0);
const backupDue = () => S.lib.length > 0 && Date.now() - lastBackup() > 30 * 864e5;
function viewBackup() {
  const lb = lastBackup();
  return `<div class="bkcard"><h3>Download backup</h3>
    <p class="note" style="margin:0 0 10px">Saves everything in one file: workouts, programs, exercise notes, assignments, and every athlete's logs, check-offs, maxes, body measurements and personal notes.</p>
    <p class="note" style="margin:0 0 12px">${lb ? 'Last backup: <b>' + fmtDate(lb) + '</b>' : 'No backup yet.'} Do this about once a month, then save the file to Google Drive or email it to yourself.</p>
    <button class="btn go" data-act="backup" id="bkbtn">Download backup</button></div>
  <div class="bkcard"><h3>Restore from backup</h3>
    <p class="note" style="margin:0 0 12px">Puts back everything in a backup file. Anything in the file replaces the current version, and things added since the backup are kept.</p>
    <label class="btn ghost" style="display:inline-block;cursor:pointer">Choose backup file<input type="file" id="bkfile" accept=".json,application/json" hidden></label></div>`;
}
async function getAll(path) { const s = await FS.collection(path).get(); return s.docs.map(d => ({ _id: d.id, ...d.data() })); }
async function doBackup() {
  const btn = $('#bkbtn'); if (btn) { btn.disabled = true; btn.textContent = 'Gathering…'; }
  try {
    const [library, programs, exinfo, assign, roster] = await Promise.all(['library', 'programs', 'exinfo', 'assign', 'roster'].map(getAll));
    const users = {};
    for (const r of roster) users[r._id] = await getAll('users/' + r._id + '/data');
    const data = { app: 'No Work No Check', version: 1, exportedAt: new Date().toISOString(), exportedBy: (AUTH.currentUser || {}).email || '', library, programs, exinfo, assign, roster, users };
    const nLogs = Object.values(users).reduce((t, a) => t + a.filter(x => !x.kind).length, 0);
    const name = `NoWorkNoCheck-backup-${isoDate(new Date())}.json`;
    const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
    let shared = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); shared = true; } catch (e) { if (e && e.name === 'AbortError') { toast('Backup not saved.'); return; } } }
    if (!shared) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
    local.set('nwnc-lastbackup', Date.now());
    toast(`Backup saved: ${library.length} workouts, ${programs.length} programs, ${roster.length} athletes, ${nLogs} sessions.`);
    render();
  } catch (e) { console.warn(e); toast('Backup failed. Check your connection and try again.'); }
  finally { const b = $('#bkbtn'); if (b) { b.disabled = false; b.textContent = 'Download backup'; } }
}
async function doRestore(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('That file isn\'t a No Work No Check backup.'); return; }
  if (!data || data.app !== 'No Work No Check') { toast('That file isn\'t a No Work No Check backup.'); return; }
  const users = data.users || {}, nUserDocs = Object.values(users).reduce((t, a) => t + a.length, 0);
  const ok = await ask(`Restore the backup from ${data.exportedAt ? fmtDate(Date.parse(data.exportedAt)) : 'this file'}? ${(data.library || []).length} workouts, ${(data.programs || []).length} programs, ${Object.keys(users).length} athletes' data (${nUserDocs} items).`, 'Restore');
  if (!ok) return;
  const ops = [];
  const add = (path, arr) => (arr || []).forEach(d => { const { _id, ...rest } = d; if (_id) ops.push([path, _id, rest]); });
  add('library', data.library); add('programs', data.programs); add('exinfo', data.exinfo); add('assign', data.assign);
  Object.entries(users).forEach(([uid, arr]) => add('users/' + uid + '/data', arr));
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = FS.batch();
      ops.slice(i, i + 400).forEach(([path, id, v]) => b.set(FS.collection(path).doc(id), v));
      await b.commit();
    }
    toast(`Restored ${ops.length} items.`);
  } catch (e) { toast(e && e.code === 'permission-denied' ? 'Restore blocked: publish the latest Firebase rules first.' : 'Restore failed partway. Check your connection and try again.'); }
}

function lineChart(pts, unit, dec) {
  const p = pts.slice(-30); if (p.length < 2) return '';
  const W = 600, H = 200, L = 46, R = 16, T = 22, B = 28;
  const vs = p.map(x => x.v), mn = Math.min(...vs), mx = Math.max(...vs), pad = (mx - mn) * 0.2 || 1, lo = mn - pad, hi = mx + pad;
  const X = i => L + i * (W - L - R) / (p.length - 1), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const f = v => dec ? v.toFixed(1) : Math.round(v);
  const grid = [lo, (lo + hi) / 2, hi].map(g => `<line x1="${L}" x2="${W - R}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${L - 6}" y="${(Y(g) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${f(g)}</text>`).join('');
  const last = p[p.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="From ${f(p[0].v)} to ${f(last.v)} ${unit}">${grid}
    <polyline fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round" points="${p.map((x, i) => `${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join(' ')}"/>
    ${p.map((x, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="4" fill="var(--panel)" stroke="var(--red)" stroke-width="2.5"><title>${shortDate(x.date)}: ${f(x.v)}${unit}</title></circle>`).join('')}
    <text x="${X(p.length - 1).toFixed(1)}" y="${(Y(last.v) - 10).toFixed(1)}" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink)">${f(last.v)}${unit}</text>
    <text x="${L}" y="${H - 8}" font-size="12" fill="var(--muted)">${shortDate(p[0].date)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="12" fill="var(--muted)">${shortDate(last.date)}</text></svg>`;
}
const fmtHeight = inches => inches ? `${Math.floor(inches / 12)}′ ${Math.round(inches % 12)}″` : '—';
function bodySummary(body, prof) {
  const ws = body.filter(b => num(b.weight) > 0), bs = body.filter(b => num(b.bf) > 0);
  const lw = ws[ws.length - 1], fw = ws[0], lb = bs[bs.length - 1], fb = bs[0];
  const chg = (a, b, u, dec) => { if (!a || !b || a === b) return ''; const d = a - b; return `<span class="chg ${d > 0 ? 'up' : 'down'}" style="margin:0">${d > 0 ? '+' : ''}${dec ? d.toFixed(1) : Math.round(d * 10) / 10}${u}</span>`; };
  const lean = lw && lb && Math.abs(lw.date - lb.date) < 3 * 864e5 ? num(lw.weight) * (1 - num(lb.bf) / 100) : 0;
  let html = `<div class="stat-row">
    <div class="stat"><b>${fmtHeight(num(prof.heightIn))}</b><span>height</span></div>
    <div class="stat"><b>${lw ? num(lw.weight) : '—'}</b><span>lbs ${lw && fw ? chg(num(lw.weight), num(fw.weight), '') : ''}</span></div>
    <div class="stat"><b>${lb ? num(lb.bf).toFixed(1) + '%' : '—'}</b><span>body fat ${lb && fb ? chg(num(lb.bf), num(fb.bf), '%', true) : ''}</span></div></div>`;
  if (lean) html += `<p class="note" style="margin-top:-6px">Lean mass ≈ <b>${lean.toFixed(1)} lbs</b> · fat mass ≈ <b>${(num(lw.weight) - lean).toFixed(1)} lbs</b></p>`;
  if (ws.length > 1) html += `<div class="chartbox"><div class="ct">Body weight</div>${lineChart(ws.map(b => ({ date: b.date, v: num(b.weight) })), ' lbs', false)}</div>`;
  if (bs.length > 1) html += `<div class="chartbox"><div class="ct">Body fat %</div>${lineChart(bs.map(b => ({ date: b.date, v: num(b.bf) })), '%', true)}</div>`;
  return html;
}

async function startSession(w) {
  if (S.session && !(await ask('You have a workout in progress. Replace it?', 'Replace it'))) return;
  let section = '', sec = '';
  const exercises = [];
  const pi = progInfo(), ph = pi && pi.wk >= 1 && pi.wk <= pi.weeks ? pi.phase : null, p = pi && pi.p;
  const isMain = n => (p && p.main || []).some(m => m.toLowerCase() === n.toLowerCase());
  const presetOK = ph && (p.presetWorkouts || []).includes(w.id);
  for (const orig of w.items) {
    if (orig.type === 'section') { section = sec = orig.label; continue; }
    const it = applyPhase(orig, w.id, ph, p);
    const pl = pctLoad(it.load, it.name, S.maxes);
    if (pl) it.pctInfo = pl.text ? `${pl.text} (max ${pl.orm})` : 'set your max in Profile';
    const rpePre = presetOK && !(p.skipSections || []).includes(sec) ? (ph.preset || '') : '';
    if (rpePre) it.rpeT = ph.rpe || rpePre;
    const n = Math.max(1, Math.min(20, parseInt(it.sets) || 1));
    const last = lastFor(it.name);
    const load = /^\d+(\.\d+)?$/.test(String(it.load).trim()) ? String(it.load).trim() : '';
    exercises.push({
      name: it.name, section, rx: { ...it },
      sets: Array.from({ length: n }, (_, i) => ({ weight: '', reps: '', rpe: '', done: false, phRPE: rpePre,
        phW: (pl && pl.mid ? String(pl.mid) : '') || load || (last && last.sets[Math.min(i, last.sets.length - 1)].weight) || '',
        phR: /^\d+$/.test(it.reps) ? it.reps : '' }))
    });
    section = '';
  }
  S.session = { id: newId(), workoutId: w.id, name: w.name, focus: w.focus || '', start: Date.now(), week: pi && pi.wk >= 1 && pi.wk <= pi.weeks ? pi.wk : null, exercises };
  saveDraft(); S.tab = 'session'; render(); window.scrollTo(0, 0);
}

    on(FS.doc('assign/' + u.uid), snap => { S.assign = snap.exists ? { [u.uid]: snap.data() } : {}; applyMine(); render(); });
  }
  on(FS.collection('users/' + u.uid + '/data'), snap => {
    const sd = splitData(snap.docs.map(d => d.data()));
    S.logs = sd.logs; S.checks = sd.checks; S.body = sd.body; S.prof = sd.prof; S.maxes = sd.maxes; S.cnotes = sd.cnotes;
    render();
  });
}
(function bootFirebase() {
  const fb = CFG.firebase || {};
  if (!window.firebase) {
    showAuth(true);
    $('#authForm').innerHTML = `<div class="setup"><b>Couldn't load sign-in.</b> The app couldn't reach Google's sign-in service. Check your internet connection, turn off any content or ad blocker for this site, then reload.</div>`;
    return;
  }
  if (!fb.apiKey || /PASTE/i.test(fb.apiKey)) {
    showAuth(true);
    $('#authForm').innerHTML = `<div class="setup"><b>Almost there.</b> This copy of the app isn't connected to Firebase yet. Open <b>firebase-config.js</b>, paste in your Firebase settings and your coach email, then upload the folder again.</div>`;
    return;
  }
  firebase.initializeApp(fb);
  FS = firebase.firestore();
  try { FS.settings({ ignoreUndefinedProperties: true }); } catch (e) {}
  FS.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  AUTH = firebase.auth();
  wireAuth();
  AUTH.getRedirectResult().catch(authErr);
  AUTH.onAuthStateChanged(u => {
    if (!u) { unsubs.forEach(f => { try { f(); } catch (e) {} }); unsubs = []; S.db = null; S.uid = null; S.canLib = false; showAuth(true); return; }
    showAuth(false); startData(u);
  });
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
